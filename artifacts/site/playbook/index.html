<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      This is a real static entry, not an SPA fallback. WhatsApp, LinkedIn and X
      do not execute JavaScript, so metadata set by React after mount is invisible
      to them. Vercel checks the filesystem before applying the SPA rewrite in
      vercel.json, so this file is served directly for /playbook and these tags
      are what a link preview actually reads.
    -->
    <title>The Scalable Startup Operating System — TD Advisory</title>
    <meta
      name="description"
      content="The Scalable Startup Operating System: a practical, implementation-focused toolkit for founders. 8 core business modules, frameworks, editable templates and implementation tools to help you scale with clarity and control. From ₦20,000."
    />
    <link rel="canonical" href="https://tdadvisory.co/playbook" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TD Advisory" />
    <meta property="og:url" content="https://tdadvisory.co/playbook" />
    <meta property="og:title" content="The Scalable Startup Operating System" />
    <meta
      property="og:description"
      content="From chaos to clarity. Build the systems, structures and management practices required to scale — across 8 core business modules. From ₦20,000."
    />
    <meta property="og:image" content="https://tdadvisory.co/opengraph.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Scalable Startup Operating System" />
    <meta
      name="twitter:description"
      content="From chaos to clarity. Build the systems, structures and management practices required to scale — across 8 core business modules. From ₦20,000."
    />
    <meta name="twitter:image" content="https://tdadvisory.co/opengraph.jpg" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
