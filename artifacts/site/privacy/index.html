<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      A real static entry, not an SPA fallback, so this page carries its own
      <title> rather than inheriting the home page's. Vercel checks the
      filesystem before applying the SPA rewrite in vercel.json, so this file is
      what actually gets served for /privacy.
    -->
    <title>Privacy Policy — TD Advisory</title>
    <meta name="description" content="How TD Advisory collects, uses and protects the information you share through this website." />
    <link rel="canonical" href="https://tdadvisory.co/privacy" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
